function evHTML(){const E=evs();return E.length?E.map(e=>`<div class="ev"><span class="tag ${e.t}">${e.t}</span><div><b>${esc(e.n)}</b><small>${esc(e.d)} · until ${e.end}</small></div></div>`).join(''):'<div style="color:var(--mut)">A quiet era — no major events.</div>'}
function news(){const n=GL.filter(g=>g.u<=G.year&&g.u>G.year-6);return n.length?`<p>🔔 <b>New technology:</b> ${n.map(g=>g.i+' '+g.n).join(', ')}</p>`:''}
function rank(){return Object.entries(TM).map(([id,t])=>({id,t,c:cash(t)})).sort((a,b)=>b.c-a.c)}
function endScreen(){const R=rank(),by={};R.forEach((r,i)=>{(by[r.t.city]=by[r.t.city]||[]).push(i)});
 const pins=R.map((r,i)=>{const c=CM[r.t.city];if(!c)return'';const [x,y]=pj(c.lo,c.la),k=by[r.t.city].indexOf(i),l=r.t.l||{};return `<g><circle cx="${x+k*14}" cy="${y-k*10}" r="12" fill="${l.c1}" stroke="${l.c2}" stroke-width="3"/><text x="${x+k*14}" y="${y-k*10+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${l.c3}">${i+1}</text></g>`}).join('');
 const lab=CITY.map(c=>{const [x,y]=pj(c.lo,c.la);return `<circle cx="${x}" cy="${y}" r="2" fill="var(--ink)"/><text x="${x+5}" y="${y+3}" font-size="8" fill="var(--mut)">${c.n}</text>`}).join('');
 return `<div class="end"><div style="text-align:center"><h1 style="font-size:34px;color:var(--red)">The Year is 1930</h1><p>The ledgers are closed. Here is how the companies of Britain fared. <button onclick="sw()">Back to menu</button></p></div><div class="wrap grid2" style="align-items:start"><div class="card"><h2>Final Ranking</h2>${R.map((r,i)=>`<div class="ev" style="align-items:center"><span class="big" style="width:44px">${['🥇','🥈','🥉'][i]||i+1}</span>${logo(r.t.l,52)}<div><b style="font-size:18px">${esc(r.t.name)}</b><small>${esc(r.t.city)}</small></div><b class="pr">${fm(r.c)}</b></div>`).join('')||'No companies.'}</div><div class="card"><h2>Seats of Industry</h2><svg viewBox="0 0 325 400" style="width:100%;max-height:75vh"><rect width="325" height="400" fill="var(--chip)" opacity=".5"/><polygon points="${poly(UK)}" fill="var(--card)" stroke="var(--brass)" stroke-width="2"/><polygon points="${poly(IE)}" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>${lab}${pins}</svg></div></div></div>`}
function head(t,ctl){return `<div class="top"><div><h1>⚙️ ${t}</h1><small>${role==='student'?'Company ledger':'The Industrial Revolution Marketplace'}</small></div><div class="ctl" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${ctl||''}<span class="yr">${G?G.year:''}</span><button onclick="sw()">Switch role</button></div></div>`}
function sw(){clearInterval(timer);timer=null;role=null;render()}
function pick(r){role=r;try{me=localStorage.getItem('indmkt_me')}catch(e){}render()}
function render(){raf=0;const A=$('#app');
 if(!role){A.innerHTML=`<div class="top"><h1>⚙️ Industrial Revolution Marketplace</h1><small>1830 – 1930</small></div>${SKY}<div class="wrap" style="text-align:center"><h1 style="font-size:32px;color:var(--red)">Build an Empire of Industry</h1><p style="color:var(--mut)">Choose your place in the Victorian economy.</p><div class="land"><button onclick="pick('student')"><div class="big">🎩</div>Student<br><small>Found a company</small></button><button onclick="pick('teacher')"><div class="big">🎓</div>Teacher<br><small>Run the economy</small></button><button onclick="pick('proj')"><div class="big">📽️</div>Projector<br><small>Live price board</small></button></div>${msg}</div>`;return}
 if(role==='teacher'&&!pinOk){A.innerHTML=head('Teacher')+`<div class="wrap">${eb()}<div class="card"><h2>Teacher PIN</h2><input id="pin" type="password" placeholder="PIN" onkeydown="if(event.key==='Enter')tpin()"> <button class="pri" onclick="tpin()">Enter</button></div></div>`;return}
 if(!loaded){A.innerHTML='<div class="wrap">Loading…</div>';return}
 if(role==='teacher')return rTeacher(A);
 if(!G){A.innerHTML=head(role==='proj'?'Price Board':'Waiting')+`<div class="wrap"><div class="card">⏳ The teacher has not opened a game yet.</div></div>`;return}
 if(G.status==='ended'){A.innerHTML=endScreen()+'';return}
 if(role==='proj')return rProj(A);
 if(!TM[me])return rWiz(A);
 rStudent(A)}
function rq(){if((role==='student'&&G&&!TM[me]||role==='teacher'&&!pinOk)&&document.activeElement&&document.activeElement.tagName==='INPUT')return;if(!raf)raf=requestAnimationFrame(render)}
function rProj(A){const c=calc(),R=rank().slice(0,8);document.body.classList.add('proj');
 A.innerHTML=head('Live Price Board')+SKY+`<div class="wrap"><div class="card" style="margin-bottom:12px"><h2>Events of the Age</h2>${evHTML()}${news()}</div><div class="card">${board(c)}</div><div class="card" style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap">${R.map(r=>`<span style="display:flex;gap:6px;align-items:center">${logo(r.t.l,34)}<b>${esc(r.t.name)}</b> ${fm(r.c)}</span>`).join('')||'No companies yet'}</div></div>`}
function rWiz(A){document.body.classList.remove('proj');const w=wiz;
 A.innerHTML=head('Found Your Company')+`<div class="wrap">${eb()}<div class="grid2"><div class="card"><h2>1 · Name & Logo</h2><input id="wn" placeholder="Company name, e.g. Pemberton &amp; Sons" value="${esc(w.name)}" oninput="wiz.name=this.value;wp()" style="width:100%;margin-bottom:10px"><div style="display:flex;gap:6px;margin-bottom:8px">${SH.map((s,i)=>`<button class="${w.s===i?'sel':''}" onclick="wiz.s=${i};render()">${logo({s:i,e:w.e,c1:w.c1,c2:w.c2,c3:w.c3},34)}</button>`).join('')}</div><div class="emb">${EM.map((e,i)=>`<button class="${w.e===i?'sel':''}" onclick="wiz.e=${i};render()">${e}</button>`).join('')}</div><p>Colours: <label>Badge <input type="color" value="${w.c1}" onchange="wiz.c1=this.value;render()"></label> <label>Border <input type="color" value="${w.c2}" onchange="wiz.c2=this.value;render()"></label> <label>Emblem <input type="color" value="${w.c3}" onchange="wiz.c3=this.value;render()"></label></p><div style="text-align:center"><div id="pv">${logo(w,110)}<h2 style="border:0">${esc(w.name)||'Your Company'}</h2></div></div></div>
 <div class="card"><h2>2 · Choose Your City</h2><div class="cty">${CITY.map(c=>`<button class="${w.city===c.n?'sel':''}" onclick="wiz.city='${c.n}';render()"><b>${c.n}</b><br><small>+10%: ${c.b.map(i=>GM[i].i).join(' ')}</small></button>`).join('')}</div><p style="color:var(--mut);font-size:13px">Your city gives +10% output on the goods shown.</p><button class="pri" style="width:100%;padding:12px" ${w.name.trim()&&w.city?'':'disabled'} onclick="found()">Found the Company ▶</button></div></div></div>`}
function wp(){const b=document.querySelector('button.pri');if(b)b.disabled=!(wiz.name.trim()&&wiz.city);const p=$('#pv h2');if(p)p.textContent=wiz.name||'Your Company'}
async function found(){const id='t'+Math.random().toString(36).slice(2,8),w=wiz;try{await db.doc('teams/'+id).set({name:w.name.trim().slice(0,40),l:{s:w.s,e:w.e,c1:w.c1,c2:w.c2,c3:w.c3},city:w.city,spent:0,earned:0,b:{},inf:{rail:0,port:0},ts:Date.now()});me=id;try{localStorage.setItem('indmkt_me',id)}catch(e){}}catch(e){err='Could not create company: '+(e&&e.message||'permission denied')+'. Check your connection and try again.';render()}}
async function buy(id,d,inf){const t=TM[me];if(!t||G.status==='ended')return;const b={...t.b},f={...(t.inf||{rail:0,port:0})};let sp=t.spent||0;
 if(inf){const o=INF.find(x=>x.id===id),n=f[id]||0;if(d>0){const c=icost(o,n);if(n>=10||cash(t)<c)return;sp+=c;f[id]=n+1}else{if(!n)return;sp-=Math.round(icost(o,n-1)*.5);f[id]=n-1}}
 else{const g=GM[id],n=b[id]||0;if(d>0){const c=cost(g,n);if(cash(t)<c)return;sp+=c;b[id]=n+1}else{if(!n)return;sp-=Math.round(cost(g,n-1)*.5);b[id]=n-1}}
 t.b=b;t.inf=f;t.spent=sp;render();try{await db.doc('teams/'+me).update({b,inf:f,spent:sp})}catch(e){}}
function gcard(g,t,c){const n=(t.b||{})[g.id]||0,cs=cost(g,n),pf=prof(g,t,c),k=c[g.id];
 return `<div class="g"><div class="h"><span class="big">${g.i}</span><div>${g.n}<br><small>owned ${n} · £${pr(g.id).toFixed(2)}${CM[t.city]&&CM[t.city].b.includes(g.id)?' · city bonus':''}</small></div></div>
 <div style="margin:6px 0;font-size:13px">${Object.keys(g.inp).length?'Needs: '+Object.entries(g.inp).map(([i,q])=>`<span class="chip" style="${c[i]&&c[i].dem>c[i].sup*1.15?'background:var(--dn);color:#fff':''}">${GM[i].i}×${q}</span>`).join(''):'<small>No inputs needed</small>'}</div>
 <div style="display:flex;justify-content:space-between;align-items:center"><b class="${pf>=0?'up':'dn'}">${pf>=0?'+':''}${fm(pf)}/yr</b><span><button onclick="buy('${g.id}',-1)" ${n?'':'disabled'}>−</button> <button class="pri" onclick="buy('${g.id}',1)" ${cash(t)>=cs?'':'disabled'}>Build ${fm(cs)}</button></span></div></div>`}
function rStudent(A){document.body.classList.remove('proj');const t=TM[me],c=calc(),U=GL.filter(g=>G.year>=g.u),L=GL.filter(g=>G.year<g.u).slice(0,8);
 const sec=(l,cat)=>`<h2 style="margin:12px 0 6px;color:var(--red)">${l}</h2><div class="cards">${U.filter(g=>g.cat===cat).map(g=>gcard(g,t,c)).join('')}</div>`;
 let body='';
 if(tab==='build')body=sec('🌾 Farms & Plantations','farm')+sec('⛏️ Mines','mine')+sec('🏭 Factories & Workshops','fact')+`<h2 style="margin:12px 0 6px;color:var(--red)">🛤️ Infrastructure</h2><div class="cards">${INF.map(f=>{const n=(t.inf||{})[f.id]||0,cs=icost(f,n);return `<div class="g"><div class="h"><span class="big">${f.i}</span><div>${f.n}<br><small>built ${n}/10</small></div></div><p style="font-size:13px">${f.d}</p><div style="text-align:right"><button onclick="buy('${f.id}',-1,1)" ${n?'':'disabled'}>−</button> <button class="pri" onclick="buy('${f.id}',1,1)" ${n<10&&cash(t)>=cs?'':'disabled'}>Build ${fm(cs)}</button></div></div>`}).join('')}</div><h2 style="margin:12px 0 6px;color:var(--mut)">🔒 Coming Technologies</h2><div>${L.map(g=>`<span class="chip">${g.i} ${g.n} — ${g.u}</span>`).join('')}</div>`;
 else if(tab==='market')body=`<div class="card">${board(c,t)}</div>`;
 else body=`<div class="card"><h2>My Holdings</h2>${Object.entries(t.b||{}).filter(e=>e[1]).map(([i,n])=>`<span class="chip">${GM[i].i} ${GM[i].n} ×${n}</span>`).join('')||'<small>Nothing built yet.</small>'}<p>🛤️ Railways ${rail(t)} · ⚓ Ports ${port(t)}</p></div><div class="card" style="margin-top:10px"><h2>Company Standings</h2>${rank().map((r,i)=>`<div class="ev" style="align-items:center"><b>${i+1}</b>${logo(r.t.l,30)}<div>${esc(r.t.name)}${r.id===me?' (you)':''}</div><b>${fm(r.c)}</b></div>`).join('')}</div>`;
 A.innerHTML=head(esc(t.name),`<span>${logo(t.l,38)}</span><span>${esc(t.city)}</span><b class="yr">${fm(cash(t))}</b>`)+SKY+`<div class="wrap"><div class="card" style="margin-bottom:10px"><h2>Events of the Age</h2>${evHTML()}${news()}</div><div class="tabs">${[['build','🏗️ Build'],['market','📈 Market'],['me','📒 My Ledger']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${body}</div>`}
async function tick(){if(!G||G.status==='ended')return;const c=calc(),pr2={...G.prices};
 GL.filter(g=>G.year>=g.u).forEach(g=>{const h=hist(g.id),p=h[h.length-1];pr2[g.id]=[...h,p+(c[g.id].tg-p)*.4].slice(-12).map(v=>+v.toFixed(2))});
 const old=G.prices;G.prices=pr2;const earn={};Object.entries(TM).forEach(([id,t])=>{let e=0;GL.forEach(g=>{const n=(t.b||{})[g.id]||0;if(n)e+=n*prof(g,t,c)*2});earn[id]=e});
 const y=G.year+2;GL.filter(g=>g.u<=y&&!pr2[g.id]).forEach(g=>pr2[g.id]=[g.p]);
 const st=y>=1930?'ended':'playing';G.year=y;G.status=st;
 try{await db.doc('game/state').update({year:y,status:st,prices:pr2});for(const id in earn)await db.doc('teams/'+id).update({earned:Math.round((TM[id].earned||0)+earn[id])})}catch(e){}}
let cf=0,err='';
const eb=()=>err?`<div class="card" style="margin-bottom:10px;color:var(--dn)"><b>${esc(err)}</b></div>`:'';
async function newGame(){if(G&&Object.keys(TM).length&&!cf){cf=1;err='Click "New Game" again within 6 seconds to confirm — this deletes all companies.';render();setTimeout(()=>{cf=0;err='';render()},6000);return}
 cf=0;err='';clearInterval(timer);timer=null;
 try{for(const id in TM)await db.doc('teams/'+id).delete();const p={};GL.filter(g=>g.u<=1830).forEach(g=>p[g.id]=[g.p]);await db.doc('game/state').set({year:1830,status:'lobby',prices:p,manual:[]})}catch(e){err='Could not create game: '+(e&&e.message||JSON.stringify(e))}
 render()}
async function startG(){await db.doc('game/state').update({status:'playing'})}
function auto(){const b=$('#ap');if(timer){clearInterval(timer);timer=null}else timer=setInterval(tick,+$('#spd').value);render()}
async function shock(i){const s=SHOCK[i];const m=[...(G.manual||[]),{n:s[0],t:s[1],d:s[2],e:s[3],end:G.year+6}];await db.doc('game/state').update({manual:m})}

function rTeacher(A){document.body.classList.remove('proj');
 if(!G){A.innerHTML=head('Teacher')+`<div class="wrap">${eb()}<div class="card"><h2>No game yet</h2><p>Create a game, then share this page's web address with your students.</p><button class="pri" onclick="newGame()">Create New Game</button></div></div>`;return}
 const c=calc(),T=rank(),U=GL.filter(g=>G.year>=g.u),running=!!timer,sp=$('#spd')?$('#spd').value:'6000';
 const ctl=`<button class="pri" onclick="${G.status==='lobby'?'startG()':'tick()'}" ${G.status==='ended'?'disabled':''}>${G.status==='lobby'?'▶ Start Game':'Next 2 Years ⏭'}</button><button id="ap" onclick="auto()" ${G.status==='playing'?'':'disabled'}>${running?'⏸ Pause':'⏵ Auto'}</button><select id="spd"><option value="3000">3s</option><option value="6000">6s</option><option value="12000">12s</option><option value="30000">30s</option></select><button onclick="newGame()">New Game</button>`;
 let p='';
 if(gtab==='teams')p=T.map(r=>`<div class="ev" style="align-items:flex-start">${logo(r.t.l,46)}<div><b>${esc(r.t.name)}</b> <small style="display:inline">${esc(r.t.city)}</small><br>${Object.entries(r.t.b||{}).filter(e=>e[1]).map(([i,n])=>`<span class="chip">${GM[i].i}×${n}</span>`).join('')||'<small>No buildings</small>'}<br><small>🛤️ ${rail(r.t)} · ⚓ ${port(r.t)}</small></div><b class="${r.c>=0?'up':'dn'}">${fm(r.c)}</b></div>`).join('')||'<div style="color:var(--mut)">No companies yet — students found them on their devices.</div>';
 else if(gtab==='events'){const up=EV.filter(e=>e[3]>G.year).slice(0,4);p=`<b>Active</b>${evHTML()}${(G.manual||[]).map((m,i)=>m.end>G.year?`<div style="text-align:right"><button onclick="endShock(${i})">End “${esc(m.n)}”</button></div>`:'').join('')}<p><b>Coming up</b></p>${up.map(e=>`<div class="ev"><span class="tag ${e[1]}">${e[1]}</span><div><b>${e[0]}</b><small>${e[3]}–${e[4]} · ${e[2]}</small></div></div>`).join('')}<p><b>Trigger a shock now</b></p><div>${SHOCK.map((s,i)=>`<button style="margin:2px" onclick="shock(${i})">${s[0]}</button>`).join('')}</div>`}
 else p=`<b>Technology timeline</b>`+GL.filter(g=>g.u>1830).reduce((a,g)=>{(a[g.u]=a[g.u]||[]).push(g);return a},[]).map((l,y)=>l?`<div class="ev"><b>${y}</b><div>${l.map(g=>`<span class="chip" style="${G.year>=y?'':'opacity:.5'}">${g.i} ${g.n}</span>`).join('')}</div></div>`:'').join('')+`<p style="font-size:13px;color:var(--mut)">Prices move toward base × (demand ÷ supply). Factories buy their inputs, so shortages ripple through supply chains. Costs rise with each building owned, the year, and the number of technologies. Population grows 1% a year.</p>`;
 A.innerHTML=head('Teacher Control',ctl)+`<div class="wrap">${eb()}<div class="grid2"><div class="card"><h2>Price Board — ${G.status==='lobby'?'Lobby':G.status==='ended'?'Game Over':'Playing'} · ${T.length} companies</h2>${board(c)}</div><div><div class="card"><div class="tabs">${[['teams','🏭 Companies'],['events','📜 Events'],['econ','⚖️ Economy']].map(([k,l])=>`<button class="${gtab===k?'on':''}" onclick="gtab='${k}';render()">${l}</button>`).join('')}</div>${p}</div></div></div></div>`+(G.status==='ended'?endScreen():'');
 $('#spd').value=sp}
const PIN={v:''};let pinOk=false;
function mkDb(){let st={game:null,teams:{}},v=0,ready=false,subs=[];
 const apply=j=>{if(j.v===v&&ready)return;v=j.v;if(j.s)st=j.s;ready=true;subs.forEach(f=>f())};
 const api=b=>fetch('api/op',{method:'POST',headers:{'content-type':'application/json','x-pin':PIN.v},body:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');apply(j);return j});
 const poll=async()=>{try{apply(await (await fetch('api/state?v='+v)).json())}catch(e){}setTimeout(poll,1500)};poll();
 const sub=f=>{subs.push(f);if(ready)f()};
 return{auth:()=>api({op:'auth'}),
  doc:p=>({set:d=>api({op:'set',path:p,data:d}),update:d=>api({op:'update',path:p,data:d}),delete:()=>api({op:'delete',path:p}),
   onSnapshot:f=>sub(()=>{const x=st.game;f({exists:!!x,data:()=>x})})}),
  collection:p=>({onSnapshot:f=>sub(()=>f({docs:Object.entries(st.teams).map(([id,d])=>({id,data:()=>d}))}))})}}
async function tpin(){PIN.v=$('#pin').value;try{await db.auth();pinOk=true;err=''}catch(e){err='Wrong PIN';pinOk=false}render()}
(()=>{db=mkDb();db.doc('game/state').onSnapshot(s=>{G=s.exists?s.data():null;rq()});db.collection('teams').onSnapshot(s=>{TM={};s.docs.forEach(d=>TM[d.id]=d.data());loaded=true;rq()});render()})();
