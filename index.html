  (T.map(r=>`<div class="ev" style="align-items:flex-start">${logo(r.t.l,46)}<div><b>${esc(r.t.name)}</b> <small style="display:inline">${esc(r.t.city)}</small><br>${chips(r.t)}<br><button onclick="tgive('${r.id}',1)">+£${tamt}</button> <button onclick="tgive('${r.id}',-1)">−£${tamt}</button> <button onclick="tbuild('${r.id}',1)">+ ${GM[tg].n}</button> <button onclick="tbuild('${r.id}',-1)">− ${GM[tg].n}</button></div><div style="text-align:right"><b class="pr">${fm(r.c)}</b><br><small class="${sg(E[r.id].net)}">${sgn(E[r.id].net)}/yr</small></div></div>`).join('')||'<div style="color:var(--mut)">No companies yet — students found them on their devices.</div>');
 else if(gtab==='events'){const up=EV.filter(e=>e[3]>G.year).slice(0,5);p=`<b>Active</b>${evHTML()}${(G.manual||[]).map((m,i)=>m.end>G.year?`<div style="text-align:right"><button onclick="endShock(${i})">End “${esc(m.n)}”</button></div>`:'').join('')}<p><b>Coming up</b></p>${up.map(e=>`<div class="ev"><span class="tag ${e[1]}">${e[1]}</span><div><b>${e[0]}</b><small>${e[3]}–${e[4]} · ${e[2]}</small></div></div>`).join('')}<p><b>Trigger a shock now</b> <small>(students get a telegram pop-up)</small></p><div>${SHOCK.map((s,i)=>`<button style="margin:2px" onclick="shock(${i})">${s[0]}</button>`).join('')}</div>`}
 else p=`<b>Ports</b><table><tr><th>Company</th><th>Ports</th><th>Dues paid</th><th>Dues received</th></tr>${T.map(r=>`<tr><td>${esc(r.t.name)}</td><td>${port(r.t)}</td><td class="neg">${fm(E[r.id].pay)}</td><td class="pos">${fm(E[r.id].rec)}</td></tr>`).join('')}</table><small>Dues = ${PORT_RATE*100}% of each company's profit, shared by ports owned (per year).</small><p><b>Technology timeline</b></p>`+GL.filter(g=>g.u>1830).reduce((a,g)=>{(a[g.u]=a[g.u]||[]).push(g);return a},[]).map((l,y)=>l?`<span class="chip" style="${G.year>=y?'':'opacity:.5'}">${y}: ${l.map(g=>g.i+' '+g.n).join(', ')}</span>`:'').join('');
 A.innerHTML=head('Teacher Control',ctl)+popBand()+`<div class="wrap">${eb()}<div class="grid2"><div class="card"><h2>Price Board — ${G.status==='lobby'?'Lobby':G.status==='ended'?'Game Over':'Playing'} · ${T.length} companies</h2>${board(c)}</div><div><div class="card"><div class="tabs">${[['teams','🏭 Companies'],['events','📜 Events'],['econ','⚖️ Economy']].map(([k,l])=>`<button class="${gtab===k?'on':''}" onclick="gtab='${k}';render()">${l}</button>`).join('')}</div>${p}</div></div></div></div>`+(G.status==='ended'?endScreen():'');
 $('#spd').value=sp;tweenPop()}
function mkDb(){let st={game:null,teams:{}},v=0,ready=false,subs=[];
 const apply=j=>{if(j.v===v&&ready)return;v=j.v;if(j.s)st=j.s;ready=true;subs.forEach(f=>f())};
 const api=b=>fetch('api/op',{method:'POST',headers:{'content-type':'application/json','x-pin':PIN.v},body:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');apply(j);return j});
 const poll=async()=>{try{apply(await (await fetch('api/state?v='+v)).json())}catch(e){}setTimeout(poll,1500)};poll();
 const sub=f=>{subs.push(f);if(ready)f()};
 return{auth:()=>api({op:'auth'}),doc:p=>({set:d=>api({op:'set',path:p,data:d}),update:d=>api({op:'update',path:p,data:d}),delete:()=>api({op:'delete',path:p}),onSnapshot:f=>sub(()=>{const x=st.game;f({exists:!!x,data:()=>x})})}),collection:p=>({onSnapshot:f=>sub(()=>f({docs:Object.entries(st.teams).map(([id,d])=>({id,data:()=>d}))}))})}}
(()=>{db=mkDb();
 db.doc('game/state').onSnapshot(s=>{const o=G;G=s.exists?s.data():null;if(!G||(o&&G.year<o.year)||G.status==='lobby')seen=null;chkEv();rq()});
 db.collection('teams').onSnapshot(s=>{TM={};s.docs.forEach(d=>TM[d.id]=d.data());loaded=true;rq()});
 if(window.twemoji){let q=0;const run=()=>['#app','#pop','#toast'].forEach(s=>{const n=$(s);if(n)twemoji.parse(n,{folder:'svg',ext:'.svg',className:'emoji'})});new MutationObserver(()=>{if(!q)q=requestAnimationFrame(()=>{q=0;run()})}).observe(document.body,{childList:true,subtree:true})}
 render()})();
</script></body></html>
